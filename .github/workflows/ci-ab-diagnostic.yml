name: CI targeted base-head comparison
on:
  push:
    branches: ['diagnostic/ci-ab-20260920']
permissions:
  contents: read
jobs:
  compare:
    name: ${{ matrix.revision.name }} / ${{ matrix.test.name }} / Java ${{ matrix.test.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        revision:
          - name: base
            sha: 1650a04cdb0d9465ef9bab6ed4a5a6d9de30a9c8
          - name: head
            sha: 5de24b8cb63d96da4bbc53d5eb974c776f434a08
        test:
          - name: opengauss
            java: '8'
            module: connector-cdc-opengauss-e2e
            selector: OpengaussCDCIT#testAddFieldWithRestore
          - name: opengauss
            java: '11'
            module: connector-cdc-opengauss-e2e
            selector: OpengaussCDCIT#testAddFieldWithRestore
          - name: checkpoint
            java: '11'
            module: connector-seatunnel-e2e-base
            selector: CheckpointCoordinatorFailoverIT#testStreamJobFailsAfterCheckpointTriggerDispatchFailure
    env:
      RUN_ALL_CONTAINER: 'true'
      RUN_ZETA_CONTAINER: 'true'
      MAVEN_OPTS: -Xmx4096m
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision.sha }}
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.test.java }}
          distribution: temurin
          cache: maven
      - name: Free disk space
        run: tools/github/free_disk_space.sh
      - name: Record environment
        run: |
          git rev-parse HEAD
          java -version
          docker version
      - name: Run original targeted test
        env:
          TEST_MODULE: ${{ matrix.test.module }}
          TEST_SELECTOR: ${{ matrix.test.selector }}
        run: |
          set -o pipefail
          ./mvnw -T 1 -B verify -DskipUT=true -DskipIT=false -Dlicense.skipAddThirdParty=true -Dskip.ui=true --no-snapshot-updates -pl ":$TEST_MODULE" -am -Pci "-Dit.test=$TEST_SELECTOR" -Dfailsafe.failIfNoSpecifiedTests=false -DfailIfNoTests=false 2>&1 | tee targeted-test.log
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.revision.name }}-${{ matrix.test.name }}-java${{ matrix.test.java }}
          path: |
            targeted-test.log
            **/target/failsafe-reports/**
          retention-days: 14
