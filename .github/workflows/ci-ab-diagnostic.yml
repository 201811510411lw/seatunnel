name: Engine targeted base-head repeated comparison
on:
  push:
    branches: ['diagnostic/ci-ab-20260920']
permissions:
  contents: read
jobs:
  compare:
    name: ${{ matrix.revision.name }} / ${{ matrix.test.name }} / Java 11 / 5 repeats
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        revision:
          - name: base
            sha: 1650a04cdb0d9465ef9bab6ed4a5a6d9de30a9c8
          - name: head
            sha: 5de24b8cb63d96da4bbc53d5eb974c776f434a08
        test:
          - name: checkpoint
            selector: CheckpointCoordinatorFailoverIT#testStreamJobFailsAfterCheckpointTriggerDispatchFailure
          - name: backpressure
            selector: BackpressureSlowSinkIT#testCheckpointsKeepCompletingUnderSustainedBackpressure
    env:
      RUN_ALL_CONTAINER: 'true'
      RUN_ZETA_CONTAINER: 'true'
      MAVEN_OPTS: -Xmx4096m
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - name: Check out diagnostic harness
        uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision.sha }}
          path: tested-source
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
      - name: Free disk space
        working-directory: tested-source
        run: tools/github/free_disk_space.sh
      - name: Repeat only the selected original method
        working-directory: tested-source
        env:
          TEST_SELECTOR: ${{ matrix.test.selector }}
          EXPECTED_SHA: ${{ matrix.revision.sha }}
          REPEATS: '5'
        run: |
          bash ../.github/scripts/engine-ab-repeat.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.revision.name }}-${{ matrix.test.name }}-java11-repeated
          path: |
            evidence/**
          if-no-files-found: error
          retention-days: 14
